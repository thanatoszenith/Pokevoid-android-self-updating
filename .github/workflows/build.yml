name: Build PokéVoid Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pokevoid-android-build
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wrapper
      - uses: actions/checkout@v4
        with:
          repository: smittynugget/pokevoid
          ref: 802a20fb8e75a873d9eaa79fc1f3febe7b420be7
          path: game
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest already provides ANDROID_HOME and Android SDK tools.
      # Avoid setup-android@v3, which attempts to install the removed 'tools' SDK package.
      - name: Validate feed and patcher
        working-directory: game
        env:
          POKEVOID_UPDATE_FEED: ${{ vars.POKEVOID_UPDATE_FEED || 'https://thanatoszenith.github.io/Pokevoid-android-self-updating/capacitor-update.json' }}
          POKEVOID_VERSION: 1.0.0
        run: |
          test -n "$POKEVOID_UPDATE_FEED"
          node --check ../wrapper/patches/apply.mjs
          node -e 'const u=new URL(process.env.POKEVOID_UPDATE_FEED);if(u.protocol!=="https:" || u.username || u.password || u.hash)process.exit(1)'
          node -e 'const v=process.env.POKEVOID_VERSION;if(!/^\d+(?:\.\d+)*$/.test(v)||v.split(".").some(x=>!Number.isSafeInteger(Number(x))))process.exit(1)'
      - name: Run local build-script tests
        working-directory: wrapper
        run: node --test tests/*.test.mjs
      - name: Build downloadable full game bundle
        working-directory: game
        env:
          POKEVOID_UPDATE_FEED: ${{ vars.POKEVOID_UPDATE_FEED || 'https://thanatoszenith.github.io/Pokevoid-android-self-updating/capacitor-update.json' }}
          POKEVOID_VERSION: 1.0.0
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -D --save-exact @capacitor/cli@7 @capacitor/android@7 @capacitor/core@7
          pnpm exec cap --version
          pnpm exec vite --version
          cp -R ../wrapper/patches .
          node patches/apply.mjs
          VITE_NATIVE_WRAPPER=1 pnpm exec vite build
          test -s dist/index.html
          rm -rf dist/pokesave
          cd dist && zip -qr "../../pokevoid-game-${POKEVOID_VERSION}.zip" .
          cd .. && node ../wrapper/scripts/verify-bundle.mjs "../pokevoid-game-${POKEVOID_VERSION}.zip"
          node ../wrapper/scripts/verify-daily-bundle.mjs "../pokevoid-game-${POKEVOID_VERSION}.zip"
      - name: Create minimal bootstrap web assets
        working-directory: game
        env:
          POKEVOID_UPDATE_FEED: ${{ vars.POKEVOID_UPDATE_FEED || 'https://thanatoszenith.github.io/Pokevoid-android-self-updating/capacitor-update.json' }}
        run: |
          cp -R ../wrapper/bootstrap .
          cp ../wrapper/patches/read-update-feed.ts bootstrap/read-update-feed.ts
          node ../wrapper/scripts/inject-feed.mjs bootstrap/main.ts
          pnpm exec vite build --config bootstrap/vite.config.mjs
          # The game build must not remain in dist when Capacitor copies web assets.
          test -s dist/index.html
          node ../wrapper/scripts/verify-bootstrap.mjs dist
          npx cap add android
          npx cap sync android
          ! grep -Rq 'capacitor-updater' android/capacitor.settings.gradle android/app/capacitor.build.gradle
          # Register the native resumable downloader in the generated Capacitor activity.
          mkdir -p android/app/src/main/java/com/zenni/pokevoid
          cp ../wrapper/native/*.java android/app/src/main/java/com/zenni/pokevoid/
          # Patch the generated MainActivity in place; never add a duplicate class.
          python3 - <<'PY'
          from pathlib import Path
          activities=list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if len(activities)!=1: raise RuntimeError(f'Expected exactly one generated MainActivity, got {activities}')
          activity=activities[0]
          source=activity.read_text()
          if 'registerPlugin(ResumableDownloadPlugin.class)' not in source:
              if 'import com.getcapacitor.BridgeActivity;' not in source: raise RuntimeError('Cannot locate BridgeActivity import')
              source=source.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport com.zenni.pokevoid.ResumableDownloadPlugin;\nimport com.zenni.pokevoid.SharedStoragePlugin;\nimport com.zenni.pokevoid.ExternalGamePlugin;\nimport android.os.Bundle;')
              marker='public class MainActivity extends BridgeActivity {'
              if marker not in source: raise RuntimeError('Generated MainActivity layout changed')
              source=source.replace(marker, marker+'\n  @Override public void onCreate(Bundle savedInstanceState) {\n    registerPlugin(ResumableDownloadPlugin.class);\n    registerPlugin(SharedStoragePlugin.class);\n    registerPlugin(ExternalGamePlugin.class);\n    getSharedPreferences("CapWebViewSettings", MODE_PRIVATE).edit().remove("serverBasePath").commit();\n    super.onCreate(savedInstanceState);\n  }')
          activity.write_text(source)
          PY
          # External files are served by the WebView HTTPS file host.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          assert '<application' in text
          import re
          if 'android:usesCleartextTraffic=' in text:
              text=re.sub('android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="false"', text, count=1)
          else:
              text=text.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          # Android 14+ requires explicit dataSync service type and permissions.
          for permission in ('android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_DATA_SYNC', 'android.permission.WAKE_LOCK'):
              if f'android:name="{permission}"' not in text:
                  text=text.replace('<application', f'<uses-permission android:name="{permission}" />\n    <application', 1)
          # Root-level shared storage requires explicit Android special app access.
          permission='<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'
          if 'android.permission.MANAGE_EXTERNAL_STORAGE' not in text:
              text=text.replace('<application', permission+'\n    <application', 1)
          service='<service android:name="com.zenni.pokevoid.DownloadForegroundService" android:exported="false" android:foregroundServiceType="dataSync" />'
          if 'DownloadForegroundService' not in text:
              text=text.replace('</application>', f'    {service}\n    </application>', 1)
          p.write_text(text)
          PY
          # Replace Capacitor's generated launcher icons with the committed PokéVoid artwork.
          python3 -m pip install --user cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import cairosvg
          svg=Path('../wrapper/assets/pokevoid-launcher.svg').read_bytes()
          resources=Path('android/app/src/main/res')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          # Remove default resources (including adaptive XML) so no generated
          # Capacitor icon silently takes precedence over the custom artwork.
          for directory in resources.glob('mipmap-*'):
              for icon in directory.glob('ic_launcher*'):
                  icon.unlink()
          for density,size in sizes.items():
              target=resources/f'mipmap-{density}'
              target.mkdir(parents=True,exist_ok=True)
              raster=cairosvg.svg2png(bytestring=svg,output_width=size*4,output_height=size*4)
              image=Image.open(BytesIO(raster)).convert('RGBA')
              image=image.resize((size,size),Image.Resampling.LANCZOS)
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  image.save(target/name,optimize=True)
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          content=manifest.read_text()
          import re
          content=re.sub(r'android:icon="[^"]+"','android:icon="@mipmap/ic_launcher"',content,count=1)
          content=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',content,count=1)
          manifest.write_text(content)
          assert (resources/'mipmap-xxxhdpi/ic_launcher.png').stat().st_size>0
          PY
          chmod +x android/gradlew
          # Fail before Gradle if native registration or permissions were not generated.
          grep -R -Fq 'registerPlugin(ResumableDownloadPlugin.class)' android/app/src/main/java
          test -s android/app/src/main/java/com/zenni/pokevoid/ResumableDownloadPlugin.java
          test -s android/app/src/main/java/com/zenni/pokevoid/DownloadForegroundService.java
          test -s android/app/src/main/java/com/zenni/pokevoid/SharedStoragePlugin.java
          grep -R -Fq 'registerPlugin(ExternalGamePlugin.class)' android/app/src/main/java
          test -s android/app/src/main/java/com/zenni/pokevoid/ExternalGamePlugin.java
          grep -Fq 'android:foregroundServiceType="dataSync"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.WAKE_LOCK' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug
      - name: Verify artifacts
        env:
          POKEVOID_VERSION: 1.0.0
        run: |
          test -s game/android/app/build/outputs/apk/debug/app-debug.apk
          node wrapper/scripts/verify-apk.mjs game/android/app/build/outputs/apk/debug/app-debug.apk
          # Verify the compiled DEX contains the native plugin class.
          python3 - <<'PY'
          from zipfile import ZipFile
          apk='game/android/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              dex_files=[name for name in z.namelist() if name.startswith('classes') and name.endswith('.dex')]
              if not dex_files: raise RuntimeError('APK contains no DEX files')
              if not any(b'ResumableDownloadPlugin' in z.read(name) for name in dex_files):
                  raise RuntimeError(f'ResumableDownloadPlugin missing from {dex_files}')
              print(f'Native downloader found in APK ({len(dex_files)} DEX files checked)')
          PY
          test -s "pokevoid-game-${POKEVOID_VERSION}.zip"
          node wrapper/scripts/verify-bundle.mjs "pokevoid-game-${POKEVOID_VERSION}.zip"
          node wrapper/scripts/verify-daily-bundle.mjs "pokevoid-game-${POKEVOID_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pokevoid-bootstrap-debug-apk
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
